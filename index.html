      '<h1>' + h(d.nome) + '</h1>' + (d.cargo ? '<div class="c">' + h(d.cargo) + '</div>' : '') + '</div></div>' +
      '<div class="kv"><div><small>Matrícula</small><b>' + h(d.id) + '</b></div><div><small>Congregação</small><b>' + h(d.congregacao || '—') + '</b></div></div>';
  }
  return '<div class="w"><div class="cab"><div class="lg" style="background-image:url(\'' + logo + '\')"></div><div><b>' + h(d.ig1) + '</b><span>' + h(d.ig2) + '</span></div></div>' +
    '<div class="box"><div class="st ' + d.cls + '"><i>' + d.ic + '</i><div><b>' + h(d.titulo) + '</b><small>' + h(d.texto) + '</small></div></div>' + pessoa +
    (d.agora ? '<p class="rod">Consulta feita em ' + h(d.agora) + ', direto no cadastro da secretaria.</p>' : '') + '</div></div>';
};
function mostrar(d){ document.getElementById("app").innerHTML = corpo(d, CFG.logo); }
var base = { ig1: CFG.ig1, ig2: CFG.ig2 };
function est(cls, ic, titulo, texto){ return Object.assign({ cls: cls, ic: ic, titulo: titulo, texto: texto }, base); }
var v = decodeURIComponent((location.hash || "").replace(/^#(v=)?/, "")) || new URLSearchParams(location.search).get("v");
window.addEventListener("hashchange", function () { location.reload(); });
if (!v) { mostrar(est("al", "!", "Verificação de carteirinhas", "Esta página só funciona a partir do QR code de uma carteirinha.")); }
else {
  mostrar(est("al", "…", "Consultando o cadastro…", "Aguarde um instante."));
  var tentar = function (n) {
    fetch(CFG.exec + "?formato=json&v=" + encodeURIComponent(v), { credentials: "omit", cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(mostrar)
      .catch(function () { if (n > 0) setTimeout(function () { tentar(n - 1); }, 1500);
        else mostrar(est("al", "!", "Não foi possível consultar agora", "Verifique a internet e tente novamente em alguns minutos.")); });
  };
  tentar(2);
}
</script>
</body>
